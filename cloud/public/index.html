<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giờ Nổ Lực · node</title>
<meta name="description" content="A Giờ Nổ Lực game node: its rate card, its public log and anchors, verified in your browser.">
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #1d1b16; --soft: #6b665b; --line: #e4dfd3; --gold: #b07a12; --good: #1f7a4a; --bad: #b3261e; --chip: #f0ebe0;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12110e; --card: #1b1a16; --ink: #ece7db; --soft: #9a9384; --line: #2e2b24; --gold: #e5b74a; --good: #5cc48b; --bad: #ef7d74; --chip: #26241e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header small { color: var(--gold); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
  h1 { margin: 2px 0 4px; font-size: 28px; }
  h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 32px 0 10px; }
  a { color: var(--gold); }
  .origin { font-family: var(--mono); color: var(--soft); font-size: 13px; word-break: break-all; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .pill { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--soft); font-weight: 600; font-size: 12px; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; min-width: 64px; text-align: center; border-radius: 4px; padding: 1px 6px; font: 600 12px var(--mono); background: var(--chip); }
  .t-offer, .t-burn { color: var(--gold); } .t-accept, .t-grant { color: var(--good); } .t-proof, .t-refund, .t-void, .t-penalty, .t-cut { color: var(--bad); }
  .log { max-height: 560px; overflow: auto; }
  .row { border-bottom: 1px solid var(--line); padding: 8px 4px; }
  .row summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; }
  .row summary::-webkit-details-marker { display: none; }
  .when { color: var(--soft); font: 12px var(--mono); white-space: nowrap; }
  .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  pre { font: 12px/1.4 var(--mono); background: var(--chip); padding: 10px; border-radius: 6px; overflow: auto; max-height: 320px; }
  .muted { color: var(--soft); font-size: 13px; }
  .lang { float: right; display: flex; gap: 4px; }
  .lang button { font: 600 12px system-ui, sans-serif; background: var(--chip); color: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .lang button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); }
  .t-contract, .t-council { color: var(--good); } .t-card { color: var(--gold); }
  @media (max-width: 600px) {
    .row summary { flex-wrap: wrap; justify-content: space-between; }
    .row .what { order: 3; flex-basis: 100%; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="lang"><button data-lang="vi">Tiếng Việt</button><button data-lang="en">English</button></div>
    <small>Giờ Nổ Lực · node</small>
    <h1 id="name">…</h1>
    <div class="origin" id="origin"></div>
    <div class="pills" id="pills"></div>
  </header>

  <h2 data-t="checks"></h2>
  <div class="card"><div id="checks" class="muted">…</div></div>

  <h2 data-t="rates"></h2>
  <div class="grid">
    <div class="card"><table id="rates"></table></div>
    <div class="card" id="policy"></div>
  </div>

  <h2 data-t="effort"></h2>
  <div class="card"><table id="effort"></table></div>

  <h2 data-t="council"></h2>
  <div class="card" id="council"></div>

  <h2 data-t="contracts"></h2>
  <div class="card" id="contracts"></div>

  <h2 data-t="anchors"></h2>
  <div class="card" id="anchors"></div>

  <h2><span data-t="log"></span> <span class="muted" id="logcount"></span></h2>
  <div class="card log" id="log"></div>

  <p class="muted" style="margin-top:32px">
    <span data-t="foot"></span> ·
    <a href="https://github.com/HaiDangVo/gnl">github.com/HaiDangVo/gnl</a> ·
    <span id="peers"></span>
  </p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const short = (s, n = 8) => esc(String(s).slice(0, n));
const time = (t) => (t ? new Date(t).toLocaleString() : "");
const gnl = (cgnl) => `${(cgnl / 100).toLocaleString(undefined, { maximumFractionDigits: 2 })} GNL`;

// RFC 8785 canonical JSON and RFC 9162 Merkle hashing — the same as ref/gnl.js, so the page trusts no one either
const canonical = (v) =>
  v === null || typeof v !== "object" ? JSON.stringify(v)
  : Array.isArray(v) ? `[${v.map(canonical).join(",")}]`
  : `{${Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => `${JSON.stringify(k)}:${canonical(v[k])}`).join(",")}}`;
const enc = new TextEncoder();
const sha = async (...parts) => {
  const all = parts.map((p) => (typeof p === "string" ? enc.encode(p) : p));
  const buf = new Uint8Array(all.reduce((n, a) => n + a.length, 0));
  let o = 0;
  for (const a of all) buf.set(a, o), (o += a.length);
  return new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
};
const b64u = (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
async function root(entries) {
  const leaves = await Promise.all(entries.map((e) => sha(new Uint8Array([0]), canonical(e))));
  const go = async (ls) => {
    if (ls.length === 0) return sha("");
    if (ls.length === 1) return ls[0];
    const k = 2 ** Math.floor(Math.log2(ls.length - 1));
    return sha(new Uint8Array([1]), await go(ls.slice(0, k)), await go(ls.slice(k)));
  };
  return b64u(await go(leaves));
}
async function opens(env, keys) {
  const jwk = keys.find((k) => k.kid === env.sig.kid);
  if (!jwk) return false;
  const key = await crypto.subtle.importKey("jwk", { kty: "OKP", crv: "Ed25519", x: jwk.x }, { name: "Ed25519" }, false, ["verify"]);
  return crypto.subtle.verify({ name: "Ed25519" }, key, unb64u(env.sig.value), enc.encode(canonical(env.payload)));
}

// The page's two languages: Vietnamese first (?lang=en or the button for English, remembered on this device)
let lang = "vi";
try {
  lang = (new URLSearchParams(location.search).get("lang") ?? localStorage.getItem("gnl-lang")) === "en" ? "en" : "vi";
} catch {}
const T = (vi, en) => (lang === "en" ? en : vi);
const HEAD = {
  checks: ["Kiểm tra ngay trong trình duyệt của bạn", "Verified in your browser"],
  rates: ["Bảng quy đổi", "Rate card"],
  contracts: ["Hợp đồng", "Contracts"],
  effort: ["Công sức: cày thế nào, giá dựa vào đâu", "Effort: how it's earned, what prices stand on"],
  council: ["Hội đồng vận hành", "Council"],
  anchors: ["Neo", "Anchors"],
  log: ["Nhật ký công khai", "Public log"],
  foot: ["Giao thức mở, đồ trong sandbox là đồ giả", "An open protocol; sandbox items are fake"],
};
const host = (o) => esc(new URL(o).host);

function describe(p) {
  switch (p.type) {
    case "offer": return T(`Người chơi ${short(p.player)}… gửi đi`, `Player ${short(p.player)}… sends`) + ` ${p.items.map((i) => `${i.qty} ${esc(i.id)}`).join(", ")} = <b>${gnl(p.cgnl)}</b> → ${host(p.aud)}`;
    case "accept": return T(`Nhận cam kết từ ${host(p.aud)}`, `Accepted from ${host(p.aud)}`) + `: <b>${gnl(p.cgnl)}</b> → ${T("cấp", "grants")} ${p.grant.map((g) => `${g.qty} ${esc(g.id)}`).join(", ")} (${Math.round(p.upfront * 100)}% ${T("ngay", "at once")})`;
    case "burn": return T(`Đã đốt đồ cho lần chuyển ${short(p.id)}…`, `Burnt the things of crossover ${short(p.id)}…`) + ` → ${host(p.aud)}`;
    case "grant": return T(`Đã cấp cho lần chuyển ${short(p.id)}… từ`, `Granted crossover ${short(p.id)}… from`) + ` ${host(p.aud)}`;
    case "refund": return T(`Hoàn lại lần chuyển ${short(p.id)}…`, `Refunded crossover ${short(p.id)}…`) + ` (${esc(p.why)})`;
    case "commit": return T(`Cam kết ngày ${esc(p.day)}: ${p.size} người chơi`, `Commitment for ${esc(p.day)}: ${p.size} players`) + `, ${T("gốc", "root")} ${short(p.root, 10)}…`;
    case "cosign": return T(`Ký xác nhận log của ${host(p.of)}`, `Co-signed ${host(p.of)}'s log`) + ` (${p.checkpoint.payload.size} ${T("mục", "entries")})`;
    case "proof": return `<b>${T("BẰNG CHỨNG GIAN LẬN", "FRAUD PROOF")}</b> (${esc(p.rule)}) ${T("chống", "against")} ${host(p.against)}: ${esc(p.why ?? "")}`;
    case "card": return T(`Bảng quy đổi mới: ${p.exports.length} thứ xuất, ${p.imports.length} thứ nhập`, `A new rate card: ${p.exports.length} exports, ${p.imports.length} imports`);
    case "contract": return T(`Ký hợp đồng tháng ${esc(p.month)} với ${host(p.aud)}`, `Signed ${esc(p.month)}'s contract with ${host(p.aud)}`);
    case "proposal": return T(`Đưa ra bỏ phiếu: ${esc(p.what)}`, `Put to the vote: ${esc(p.what)}`);
    case "void": return `<b>${T("HUỶ lần chuyển", "VOIDED crossover")}</b> ${short(p.id)}… → ${host(p.aud)}: ${esc(p.why)}`;
    case "penalty": return T(`Phạt: tài khoản ${p.side === "sent" ? "gửi" : "nhận"} nợ ${gnl(p.cgnl)}`, `Penalty: the ${p.side === "sent" ? "sending" : "receiving"} account owes ${gnl(p.cgnl)}`);
    case "repay": return T(`Trả nợ ${gnl(p.cgnl)}, còn nợ ${gnl(p.left)}`, `Debt paid ${gnl(p.cgnl)}, ${gnl(p.left)} left`);
    case "council": return p.op === "master" ? T(`Master mới: ${esc(p.member?.account)}`, `New master: ${esc(p.member?.account)}`) : T(`Hội đồng: ${esc(p.member?.name ?? p.member?.account)} ${p.op === "join" ? "vào" : "rời"}${p.master ? " (master)" : ""}`, `Council: ${esc(p.member?.name ?? p.member?.account)} ${p.op === "join" ? "joins" : "leaves"}${p.master ? " (master)" : ""}`);
    case "order": return `<b>${T("Lệnh hội đồng", "Council order")}</b> ${esc(p.op)}${p.account ? ` ${esc(p.account)}` : ""}${p.aud ? ` ${host(p.aud)}` : ""}${p.id ? ` ${short(p.id)}…` : ""}: ${esc(p.why)} (${p.ballots.length} ${T("chữ ký", "signatures")})`;
    case "cut": return `<b>${T("THU phần chưa trao", "CUT what wasn't handed over")}</b> ${short(p.id)}… ${T("từ", "from")} ${host(p.aud)}: ${esc(p.why)}`;
    case "link": return T(`Liên kết nguồn ${p.op === "on" ? "mới" : "huỷ"} với`, `Source link ${p.op === "on" ? "made" : "undone"} with`) + ` ${host(p.aud)} (${short(p.holder)}… ⇄ ${short(p.source)}…)`;
    case "tally": return T(`Kết quả bỏ phiếu: ${Math.round(p.weight)}/100, ${p.pass ? "thông qua" : "không qua"}`, `Vote result: ${Math.round(p.weight)}/100, ${p.pass ? "passed" : "failed"}`);
    default: return esc(p.type);
  }
}

/** The contract windows, as ref/gnl.js has them: a month's side is valid from the last 7 days of the month before. */
const monthAdd = (m, n) => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1)).toISOString().slice(0, 7);
const windowOpens = (m) => new Date(Date.parse(`${m}-01T00:00:00Z`) - 7 * 86_400_000).toISOString();

let data;
async function load() {
  const [card, text, cp] = await Promise.all([
    fetch("/.well-known/gio-no-luc.json").then((r) => r.json()),
    fetch("/gnl/log/entries.jsonl").then((r) => r.text()),
    fetch("/gnl/log/checkpoint.json").then((r) => r.json()),
  ]);
  const entries = text.split("\n").filter(Boolean).map((l) => JSON.parse(l));
  // Each partner's side of the contracts, from its own log (where its server lets this page read it)
  const theirs = {};
  await Promise.all((card.payload.witnesses ?? []).map(async (o) => {
    try {
      const t = await fetch(`${o}/gnl/log/entries.jsonl`).then((r) => (r.ok ? r.text() : Promise.reject()));
      theirs[o] = t.split("\n").filter(Boolean).map((l) => JSON.parse(l).payload).filter((p) => p.type === "contract" && p.aud === card.payload.iss);
    } catch {
      theirs[o] = null;
    }
  }));
  const checks = [];
  try {
    const keys = card.payload.keys;
    checks.push([["Rate card ký bằng khoá của chính game", "The rate card is signed by the game's own key"], await opens(card, keys)]);
    checks.push([["Checkpoint có chữ ký hợp lệ", "The checkpoint's signature is valid"], await opens(cp, keys)]);
    checks.push([[`Gốc Merkle của ${entries.length} mục khớp checkpoint`, `The ${entries.length} entries hash to the checkpoint`], cp.payload.size === entries.length && (await root(entries)) === cp.payload.root]);
    let bad = 0;
    for (const e of entries.slice(-200)) if (!(await opens(e, keys))) bad++;
    checks.push([[`Chữ ký của ${Math.min(200, entries.length)} mục gần nhất`, `The latest ${Math.min(200, entries.length)} entries are signed`], bad === 0]);
  } catch (e) {
    checks.push([[`Trình duyệt này chưa kiểm được Ed25519 (${esc(e.message)})`, `This browser can't verify Ed25519 (${esc(e.message)})`], null]);
  }
  const effort = await fetch("/gnl/effort.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
  // Each council member seated with a consent their own key signed: checked here too
  const consents = {};
  for (const e of entries.filter((x) => x.payload.type === "council" && x.payload.op === "join")) {
    const m = e.payload.member;
    try {
      consents[m.account] = e.payload.consent?.payload?.member === m.account && e.payload.consent.payload.iss === card.payload.iss && (await opens(e.payload.consent, [{ kid: m.kid, x: m.x }]));
    } catch {
      consents[m.account] = null;
    }
  }
  data = { card, entries, cp, theirs, checks, effort, consents };
}

function render() {
  const { card, entries, cp, theirs, checks, effort, consents } = data;
  document.documentElement.lang = lang;
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = T(...HEAD[el.dataset.t]);
  const c = card.payload;
  document.title = `${c.game.name} · Giờ Nổ Lực`;
  $("name").textContent = c.game.name;
  $("origin").textContent = c.iss;
  const count = (t) => entries.filter((e) => e.payload.type === t).length;
  const proofs = count("proof");
  $("pills").innerHTML = [
    `<span class="pill">${entries.length} ${T("mục trong log", "log entries")}</span>`,
    `<span class="pill">${count("offer")} ${T("lần gửi đi", "sent")} · ${count("grant")} ${T("lần nhận về", "received")}</span>`,
    `<span class="pill">checkpoint ${time(cp.payload.t)}</span>`,
    proofs ? `<span class="pill bad">${proofs} ${T("bằng chứng gian lận đã ghi", "fraud proofs logged")}</span>` : `<span class="pill ok">${T("không có bằng chứng gian lận", "no fraud proofs")}</span>`,
  ].join("");
  $("checks").innerHTML = checks.map(([t, ok]) => `<div>${ok === true ? "✅" : ok === false ? "❌" : "⚠️"} ${T(...t)}</div>`).join("");

  const imp = Object.fromEntries(c.imports.map((r) => [r.id, r.cgnlPer]));
  $("rates").innerHTML = `<tr><th>${T("Thứ", "Thing")}</th><th style="text-align:right">${T("Xuất", "Out")}</th><th style="text-align:right">${T("Nhập", "In")}</th></tr>` +
    c.exports.map((r) => `<tr><td>${esc(r.name)} <span class="muted">(${esc(r.unit)})</span></td><td class="n">${gnl(r.cgnlPer)}</td><td class="n">${imp[r.id] ? gnl(imp[r.id]) : "—"}</td></tr>`).join("") +
    `<tr><td colspan="3" class="muted">${T("Mỗi đơn vị đáng bao nhiêu Giờ Nổ Lực. Nhập luôn ≥ xuất (R8), nên không vòng chuyển nào sinh lời. Giá đổi tối đa mỗi tuần một lần, báo trước một tuần.", "What each unit is worth in Giờ Nổ Lực. In always costs ≥ out (R8), so no loop of crossovers gains anything. Rates change at most once a week, with a week's notice.")} ${T("Bảng này từ", "This card since")} ${time(c.iat)}.</td></tr>`;
  $("policy").innerHTML = `
    <div><b>${T("Trần giờ mỗi ngày", "Daily ceiling")}</b>: ${c.hoursPerDay.adult} ${T("giờ (người lớn)", "h (adults)")}, ${c.hoursPerDay.minor} ${T("giờ (dưới 18)", "h (under 18)")}</div>
    <div><b>${T("Hạn mức nhận mỗi tuần từ một game", "Weekly line per partner")}</b>: ${gnl(c.policy.lineStart)}, ${T("nhân đôi mỗi tháng hợp đồng được gia hạn, tối đa", "doubling each month the contract is renewed, up to")} ${gnl(c.policy.lineCap)}</div>
    <div><b>${T("Nhận ngay", "At once")}</b>: ${Math.round(c.policy.upfront * 100)}%, ${T("phần còn lại mở dần khi chơi", "the rest unlocks with play")}</div>
    <div><b>${T("Tốc độ tối đa", "Pace")}</b>: ${Object.entries(c.pace).map(([f, g]) => `${esc(f)} ${g.burst} + ${g.perHour}/${T("giờ", "h")}`).join(" · ")}</div>
    <div class="muted" style="margin-top:6px"><b>${c.stage === "live" ? T("Live: đồ thật", "Live: real things") : T("Sandbox: đồ chơi, được làm lại từ đầu", "Sandbox: toy things, may start over")}</b> · ${T("Quốc gia", "Jurisdiction")}: ${esc(c.game.jurisdiction)} · ${T("khoá", "keys")} ${c.keys.map((k) => esc(k.kid)).join(", ")}</div>`;

  const basis = { measured: T("đo từ người chơi", "measured"), design: T("theo thiết kế", "by design"), declared: T("tự khai", "declared"), guess: T("ước đoán", "a guess") };
  $("effort").innerHTML = effort?.things?.length
    ? `<tr><th>${T("Thứ", "Thing")}</th><th>${T("Cày thế nào", "How it's earned")}</th><th>${T("Giá dựa vào", "Basis")}</th></tr>` +
      effort.things.map((t) => `<tr><td>${esc(t.name)} <span class="muted">(${esc(t.unit)})</span><div class="muted">${T("xuất", "out")} ${t.out ? gnl(t.out) : "—"} · ${T("nhập", "in")} ${t.in ? gnl(t.in) : "—"}</div></td><td>${esc(t.how ?? "")}</td><td>${esc(basis[t.basis] ?? t.basis ?? "")}${t.samples ? ` <span class="muted">(${t.samples} ${T("mẫu", "samples")})</span>` : ""}</td></tr>`).join("") +
      `<tr><td colspan="3" class="muted">${T("Bảng chuẩn ở", "The standard sheet at")} <a href="/gnl/effort.json">/gnl/effort.json</a> ${T("(SPEC §4.1), người và AI cùng đọc.", "(SPEC §4.1), for people and agents alike.")}</td></tr>`
    : `<tr><td class="muted">${T("Game này chưa công bố bảng công sức.", "This game hasn't published its effort sheet.")}</td></tr>`;
  $("council").innerHTML = c.council?.length
    ? c.council.map((m) => `<div>${consents[m.account] === true ? "✅" : consents[m.account] === false ? "❌" : "⚠️"} <b>${esc(m.name)}</b> · ${T("tài khoản", "account")} ${esc(m.account)}${m.account === c.master ? ` · <b>master</b>` : ""} · <a href="${esc(m.profile)}">${T("hồ sơ", "profile")}</a></div>`).join("") +
      `<div class="muted" style="margin-top:6px">${T("✅ = người này tự ký đồng ý bằng khoá riêng của họ, trình duyệt của bạn vừa kiểm. Vào, ra, đổi master đều ghi trong nhật ký bên dưới.", "✅ = this person signed their own consent with their own key, just checked by your browser. Joins, leaves and master changes are all in the log below.")}</div>`
    : `<span class="muted">${T("Game này chưa công bố hội đồng.", "This game hasn't published a council.")}</span>`;

  // Contracts: this month's and next, each side, and whether crossing is open now (SPEC §5.1)
  const now = new Date().toISOString();
  const m = now.slice(0, 7);
  const next = monthAdd(m, 1);
  const lastWeek = now >= windowOpens(next);
  const mine = entries.map((e) => e.payload).filter((p) => p.type === "contract");
  const has = (list, o, mo) => list?.some((p) => (p.aud === o || o === null) && p.month === mo);
  const mark = (v) => (v === null ? "?" : v ? "✅" : "—");
  $("contracts").innerHTML = (c.witnesses ?? []).length
    ? `<table><tr><th>${T("Đối tác", "Partner")}</th><th>${esc(m)}</th>${lastWeek ? `<th>${esc(next)}</th>` : ""}<th>${T("Chuyển được", "Open")}</th></tr>` +
      c.witnesses.map((o) => {
        const t = theirs[o];
        const side = (mo) => `${T("mình", "us")} ${mark(has(mine, o, mo))} · ${T("họ", "them")} ${t === null ? "?" : mark(has(t, null, mo))}`;
        const open = has(mine, o, m) && (t === null || has(t, null, m)) && (!lastWeek || (has(mine, o, next) && (t === null || has(t, null, next))));
        return `<tr><td><a href="${esc(o)}">${host(o)}</a></td><td>${side(m)}</td>${lastWeek ? `<td>${side(next)}</td>` : ""}<td>${open ? "✅" : "⛔"}</td></tr>`;
      }).join("") +
      `<tr><td colspan="4" class="muted">${T("Hợp đồng theo tháng, mỗi bên ký vào log của mình. Gia hạn trong 7 ngày cuối tháng; trong tuần đó chưa đủ hai chữ ký cho tháng sau thì không chuyển được. ? = trang này không đọc được log của họ.", "Monthly contracts, each side signed in its own log. Renewed in the month's last 7 days; in that week nothing crosses until both have signed next month's. ? = this page can't read their log.")}</td></tr></table>`
    : `<span class="muted">${T("Chưa có đối tác.", "No partners yet.")}</span>`;

  const anchors = cp.payload.anchors ?? [];
  $("anchors").innerHTML = anchors.length
    ? anchors.slice().reverse().map((a) => a.kind === "ronin"
        ? `<div>⛓️ Ronin Saigon · <a href="https://saigon-explorer.roninchain.com/tx/${esc(a.ref.split(":")[1])}">${short(a.ref.split(":")[1], 18)}…</a> <span class="muted">checkpoint ${short(a.checkpoint, 10)}…</span></div>`
        : `<div>₿ Bitcoin (OpenTimestamps) · <a download="checkpoint-${short(a.checkpoint, 10)}.ots" href="data:application/octet-stream;base64,${esc(a.ref)}">${T("tải file .ots", "download the .ots")}</a> <span class="muted">checkpoint ${short(a.checkpoint, 10)}… · ${T("kiểm bằng", "check with")} <code>ots upgrade</code> ${T("rồi", "then")} <code>ots verify</code></span></div>`).join("")
    : `<span class="muted">${T("Chưa có neo nào trong checkpoint này.", "No anchors in this checkpoint yet.")}</span>`;

  $("logcount").textContent = `(${entries.length})`;
  $("log").innerHTML = entries.slice().reverse().slice(0, 150).map((e) => `
    <details class="row"><summary><span class="tag t-${esc(e.payload.type)}">${esc(e.payload.type)}</span><span class="what">${describe(e.payload)}</span><span class="when">${time(e.payload.iat)}</span></summary>
    <pre>${esc(JSON.stringify(e, null, 1))}</pre></details>`).join("") || `<span class="muted">${T("Log trống.", "The log is empty.")}</span>`;

  $("peers").innerHTML = (c.witnesses ?? []).map((o) => `${T("game đối tác", "partner")}: <a href="${esc(o)}">${host(o)}</a>`).join(" · ");
}

for (const b of document.querySelectorAll(".lang button"))
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try {
      localStorage.setItem("gnl-lang", lang);
    } catch {}
    if (data) render();
  });
async function main() {
  await load();
  render();
}
main().catch((e) => ($("checks").textContent = `${T("Không tải được node", "Couldn't load the node")}: ${e.message}`));
</script>
</body>
</html>
